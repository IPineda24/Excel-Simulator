<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Certification Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
        <div class="header-left">
            <span class="timer-badge">⏱ <span id="timer">80:00</span></span>
            <button id="go-summary">Go to Summary</button>
        </div>
        <h1 id="project-title">Project 1 of 7: Residences</h1>
        <div class="header-right">
            <!-- <button id="downloadBtn">Descargar Archivo TXT</button> -->
            <button class="icon-btn">☰</button>
        </div>
    </div>

    <div class="navigation">
        <div class="nav-controls">
            <button id="reset-btn">Go to challenges</button>
        </div>
        <div id="navigation-bar"></div>
        
        <button id="submit-project">Submit Project</button>
    </div>

    <div class="question-section">
        <p id="question-text">Question will appear here</p>
        
        <div class="action-buttons">
            <button id="markFC" class="action-btn"><strong>Mark</strong> Complete</button>
            <button id="markFR" class="action-btn">Mark for Review</button>
            <button class="action-btn">Mark for Feedback</button>
        </div>
    </div>

    <script src="main.js"></script>
    
</body>
</html>
